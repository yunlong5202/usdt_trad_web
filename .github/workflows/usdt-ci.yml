name: USDT web CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes pnpm@9.15.1 install --frozen-lockfile
      - run: npx --yes pnpm@9.15.1 lint
      - run: npx --yes pnpm@9.15.1 type-check
      - run: npx --yes pnpm@9.15.1 test:unit
      - run: npx --yes pnpm@9.15.1 build:prod
